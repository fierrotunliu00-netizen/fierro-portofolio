<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fierro Surya — Portofolio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #201111;
    --panel: rgba(20, 16, 34, 0.75);
    --border: #35305a;
    --text: #ece9f7;
    --muted: #9b93bf;
    --accent: #a855f7;
  * { box-sizing: border-box; }

    --accent2: #3b82f6;
    --accent-dim: rgba(168, 85, 247, 0.35);
    --ok: #60a5fa;
    --glitch-black: #000000;
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    background: linear-gradient(-45deg, #05040a, #1e1040, #0b1b4d, #05040a);
    background-size: 400% 400%;
    animation: bgshift 1.5s ease infinite;
  }

  @keyframes bgshift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* subtle scanline texture on the whole page */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.02) 0px,
      rgba(255, 255, 255, 0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 2;
  }

  /* faint ambient red glow drifting behind the card */
  body::after {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: drift 12s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes drift {
    0%, 100% { transform: translate(-55%, -52%) scale(1); }
    50% { transform: translate(-45%, -48%) scale(1.15); }
  }

  .window {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(168, 85, 247, 0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid var(--border);
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  .titlebar span {
    margin-left: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 44px 40px 48px;
    font-family: 'JetBrains Mono', monospace;
  }

  .line, .skills, .cta {
    width: 100%;
    text-align: center;
  }

  .line {
    font-size: 17px;
    line-height: 1.9;
    color: var(--muted);
  }

  .line .prompt { color: var(--ok); }
  .line .out { color: var(--text); font-weight: 500; }

  .name {
    position: relative;
    margin: 22px 0 6px;
    font-family: 'Orbitron', 'JetBrains Mono', monospace;
    font-size: 34px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    animation: flicker 3.2s linear infinite, jitter 2.4s steps(2, jump-none) infinite;
  }

  .name::before,
  .name::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Orbitron', 'JetBrains Mono', monospace;
  }

  .name::before {
    left: 3px;
    text-shadow: -5px 0 var(--accent);
    clip-path: inset(0 0 0 0);
    animation: glitch-top 0.9s infinite steps(8, jump-none) alternate-reverse;
  }

  .name::after {
    left: -3px;
    text-shadow: 5px 0 var(--glitch-black);
    clip-path: inset(0 0 0 0);
    animation: glitch-bottom 0.7s infinite steps(6, jump-none) alternate-reverse;
  }

  @keyframes glitch-top {
    0%   { clip-path: inset(0 0 85% 0); transform: translate(0, 0) skewX(0deg); }
    10%  { clip-path: inset(10% 0 60% 0); transform: translate(-4px, -2px) skewX(4deg); }
    20%  { clip-path: inset(40% 0 35% 0); transform: translate(4px, 2px) skewX(-3deg); }
    30%  { clip-path: inset(5% 0 80% 0); transform: translate(-3px, 0) skewX(2deg); }
    40%  { clip-path: inset(60% 0 10% 0); transform: translate(5px, -2px) skewX(-4deg); }
    50%  { clip-path: inset(0 0 90% 0); transform: translate(0, 0) skewX(0deg); }
    60%  { clip-path: inset(70% 0 5% 0); transform: translate(-5px, 2px) skewX(3deg); }
    70%  { clip-path: inset(20% 0 50% 0); transform: translate(3px, 0) skewX(-2deg); }
    80%  { clip-path: inset(0 0 85% 0); transform: translate(-3px, -2px) skewX(4deg); }
    100% { clip-path: inset(0 0 92% 0); transform: translate(0, 0) skewX(0deg); }
  }

  @keyframes glitch-bottom {
    0%   { clip-path: inset(85% 0 0 0); transform: translate(0, 0) skewX(0deg); }
    10%  { clip-path: inset(60% 0 10% 0); transform: translate(4px, 2px) skewX(-4deg); }
    20%  { clip-path: inset(35% 0 40% 0); transform: translate(-4px, -2px) skewX(3deg); }
    30%  { clip-path: inset(80% 0 5% 0); transform: translate(3px, 0) skewX(-2deg); }
    40%  { clip-path: inset(10% 0 60% 0); transform: translate(-5px, 2px) skewX(4deg); }
    50%  { clip-path: inset(90% 0 0 0); transform: translate(0, 0) skewX(0deg); }
    60%  { clip-path: inset(5% 0 70% 0); transform: translate(5px, -2px) skewX(-3deg); }
    70%  { clip-path: inset(50% 0 20% 0); transform: translate(-3px, 0) skewX(2deg); }
    80%  { clip-path: inset(85% 0 0 0); transform: translate(3px, 2px) skewX(-4deg); }
    100% { clip-path: inset(92% 0 0 0); transform: translate(0, 0) skewX(0deg); }
  }

  @keyframes jitter {
    0%, 88%, 100% { transform: translate(0, 0); }
    89% { transform: translate(-4px, 1px); }
    91% { transform: translate(4px, -1px); }
    93% { transform: translate(-2px, 2px); }
    95% { transform: translate(3px, 0); }
    97% { transform: translate(0, -2px); }
  }

  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
    20%, 22%, 24%, 55% { opacity: 0.35; }
  }

  .role {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 30px;
  }

  .photo-wrap {
    display: flex;
    justify-content: center;
    margin: 8px 0 28px;
  }

  .photo-frame {
    position: relative;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    padding: 4px;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 2;
  }

  .photo-frame::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--glitch-black), var(--accent), transparent 50%, var(--accent));
    animation: spin 1s linear infinite;
    z-index: 1;
  }

  .photo-frame::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    box-shadow: 0 0 20px 4px var(--accent-dim);
    animation: pulse 2s ease-in-out infinite alternate;
    z-index: 0;
  }

  .glitch-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 3px solid var(--glitch-black);
    z-index: 3;
    pointer-events: none;
    animation: ring-glitch 1.4s steps(2, jump-none) infinite;
  }

  @keyframes ring-glitch {
    0%   { clip-path: inset(0 60% 0 0 round 50%); border-color: var(--accent); transform: translate(0, 0); }
    15%  { clip-path: inset(0 0 55% 0 round 50%); border-color: var(--glitch-black); transform: translate(3px, -2px); }
    30%  { clip-path: inset(50% 0 0 0 round 50%); border-color: var(--accent); transform: translate(-3px, 2px); }
    45%  { clip-path: inset(0 0 0 55% round 50%); border-color: var(--glitch-black); transform: translate(2px, 2px); }
    60%  { clip-path: inset(0 55% 0 0 round 50%); border-color: var(--accent); transform: translate(-2px, -2px); }
    75%  { clip-path: inset(60% 0 0 0 round 50%); border-color: var(--glitch-black); transform: translate(3px, 0); }
    90%  { clip-path: inset(0 0 0 60% round 50%); border-color: var(--accent); transform: translate(0, -3px); }
    100% { clip-path: inset(0 60% 0 0 round 50%); border-color: var(--glitch-black); transform: translate(0, 0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    from { box-shadow: 0 0 15px 2px var(--accent-dim); }
    to { box-shadow: 0 0 32px 10px var(--accent-dim); }
  }

  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 18px 0 28px;
  }

  .skill-tag {
    position: relative;
    font-size: 15px;
    padding: 8px 18px;
    border: 2px solid var(--accent);
    border-radius: 20px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    animation: tag-border 0.8s steps(2, jump-none) infinite alternate,
               tag-jitter 1.6s steps(3, jump-none) infinite;
  }

  @keyframes tag-border {
    0%   { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-dim); }
    50%  { border-color: var(--glitch-black); box-shadow: 0 0 10px rgba(0, 0, 0, 0.7); }
    100% { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-dim); }
  }

  @keyframes tag-jitter {
    0%, 80%, 100% { transform: translate(0, 0); }
    83% { transform: translate(-1px, 1px); }
    86% { transform: translate(1px, -1px); }
    89% { transform: translate(0, 0); }
  }

  .cta {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .ig-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    padding: 16px 30px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .ig-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px var(--accent-dim);
  }

  .ig-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .tiktok-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, var(--glitch-black), #1a1a1a);
    color: #fff;
    padding: 16px 30px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    border: 1px solid var(--border);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .tiktok-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
  }

  .tiktok-link:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--ok);
    margin-left: 4px;
    animation: blink 1s step-start infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @media (max-width: 480px) {
    .content { padding: 30px 20px 34px; }
    .name { font-size: 26px; }
    .photo-frame { width: 190px; height: 190px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  #matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  #logo-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .logo-float {
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform;
    filter: drop-shadow(0 0 10px var(--accent-dim));
    opacity: 0.55;
  }

  .school {
    font-size: 15px;
    color: var(--muted);
  }

  .school .out { color: var(--accent2); font-weight: 600; }

  .school-logo-wrap {
    display: flex;
    justify-content: center;
    margin: 4px 0 6px;
  }

  .school-logo-wrap img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    filter: drop-shadow(0 0 10px var(--accent-dim));
  }
</style>
</head>

  <script>
    (function () {
      var layer = document.getElementById('logo-layer');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ikon skill/stack yang dipakai Fierro — muncul mengambang di background
      var iconClasses = [
        'fa-brands fa-html5',
        'fa-brands fa-css3-alt',
        'fa-brands fa-python',
        'fa-brands fa-js',
        'fa-brands fa-github'
      ];
      var colors = ['#a855f7', '#3b82f6', '#60a5fa', '#a855f7', '#ece9f7'];

      var LOGO_COUNT = 12;
      var logos = [];
      var W = window.innerWidth, H = window.innerHeight;

      function makeLogo(i) {
        var el = document.createElement('i');
        var idx = i % iconClasses.length;
        el.className = 'logo-float ' + iconClasses[idx];
        var size = 22 + Math.random() * 26;
        el.style.fontSize = size + 'px';
        el.style.color = colors[idx];
        layer.appendChild(el);

        return {
          el: el,
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          size: size,
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 0.3
        };
      }

      function init() {
        W = window.innerWidth;
        H = window.innerHeight;
        for (var i = 0; i < LOGO_COUNT; i++) logos.push(makeLogo(i));
      }

      // titik interaksi: mouse ATAU sentuhan (touch) di mana saja di background
      var touch = { x: null, y: null, active: false };

      function setTouch(x, y) {
        touch.x = x;
        touch.y = y;
        touch.active = true;
      }
      function clearTouch() {
        touch.active = false;
      }

      window.addEventListener('mousemove', function (e) { setTouch(e.clientX, e.clientY); });
      window.addEventListener('mouseleave', clearTouch);

      window.addEventListener('touchstart', function (e) {
        var t = e.touches[0];
        if (t) setTouch(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        if (t) setTouch(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchend', clearTouch);

      var RADIUS = 160;

      function step() {
        for (var i = 0; i < logos.length; i++) {
          var l = logos[i];

          if (touch.active && touch.x !== null) {
            var dx = l.x - touch.x;
            var dy = l.y - touch.y;
            var dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist < RADIUS) {
              var force = (RADIUS - dist) / RADIUS * 0.9;
              l.vx += (dx / dist) * force;
              l.vy += (dy / dist) * force;
              l.vrot += (Math.random() - 0.5) * 2;
            }
          }

          l.x += l.vx;
          l.y += l.vy;
          l.rot += l.vrot;

          // gesekan biar ga terus ngebut selamanya
          l.vx *= 0.94;
          l.vy *= 0.94;
          l.vrot *= 0.95;

          // bungkus ke sisi lain layar
          if (l.x < -60) l.x = W + 60;
          if (l.x > W + 60) l.x = -60;
          if (l.y < -60) l.y = H + 60;
          if (l.y > H + 60) l.y = -60;

          l.el.style.transform =
            'translate(' + l.x + 'px,' + l.y + 'px) rotate(' + l.rot + 'deg)';
        }
        requestAnimationFrame(step);
      }

      init();
      window.addEventListener('resize', function () {
        W = window.innerWidth;
        H = window.innerHeight;
      });

      if (!reduceMotion) {
        requestAnimationFrame(step);
      } else {
        // tetap tampilkan logo diam di posisi awal tanpa animasi
        for (var j = 0; j < logos.length; j++) {
          var lg = logos[j];
          lg.el.style.transform = 'translate(' + lg.x + 'px,' + lg.y + 'px)';
        }
      }
    })();
  </script>

  <script>
    (function () {
      var canvas = document.getElementById('matrix');
      var ctx = canvas.getContext('2d');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var chars = '0123456789ABCDEF';
      var fontSize = 15;
      var columns, drops, dpr, W, H;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        columns = Math.floor(W / fontSize);
        drops = [];
        for (var i = 0; i < columns; i++) {
          drops[i] = Math.random() * -H / fontSize;
        }
      }

      function draw() {
        ctx.fillStyle = 'rgba(5, 4, 10, 0.13)';
        ctx.fillRect(0, 0, W, H);

        ctx.font = fontSize + 'px "JetBrains Mono", monospace';

        for (var i = 0; i < columns; i++) {
          var char = chars[Math.floor(Math.random() * chars.length)];
          var x = i * fontSize;
          var y = drops[i] * fontSize;

          // leading character brighter, rest fades via the trail
          ctx.fillStyle = Math.random() < 0.06 ? 'rgba(210, 190, 255, 0.9)' : 'rgba(168, 85, 247, 0.75)';
          ctx.fillText(char, x, y);

          if (y > H && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      function loop() {
        draw();
        requestAnimationFrame(loop);
      }

      resize();
      window.addEventListener('resize', resize);

      if (!reduceMotion) {
        requestAnimationFrame(loop);
      } else {
        ctx.fillStyle = 'rgba(5, 4, 10, 1)';
        ctx.fillRect(0, 0, W, H);
        draw();
      }
    })();
  </script>

  <script>
    (function () {
      var canvas = document.getElementById('particles');
      var ctx = canvas.getContext('2d');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W, H, dpr;
      var particles = [];
      var PARTICLE_COUNT = 90;
      var LINK_DIST = 130;
      var accentA = [168, 85, 247];  // --accent
      var accentB = [59, 130, 246];  // --accent2

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makeParticle() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.6 + 0.6
        };
      }

      function init() {
        resize();
        particles = [];
        for (var i = 0; i < PARTICLE_COUNT; i++) particles.push(makeParticle());
      }

      var mouse = { x: null, y: null };
      window.addEventListener('mousemove', function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener('mouseleave', function () {
        mouse.x = null;
        mouse.y = null;
      });

      function step(oneShot) {
        ctx.clearRect(0, 0, W, H);

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;

          if (mouse.x !== null) {
            var dx = p.x - mouse.x;
            var dy = p.y - mouse.y;
            var d2 = dx * dx + dy * dy;
            if (d2 < 120 * 120) {
              var d = Math.sqrt(d2) || 1;
              var force = (120 - d) / 120 * 0.04;
              p.vx += (dx / d) * force;
              p.vy += (dy / d) * force;
            }
          }

          p.vx *= 0.995;
          p.vy *= 0.995;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(168, 85, 247, 0.55)';
          ctx.fill();
        }

        for (var a = 0; a < particles.length; a++) {
          for (var b = a + 1; b < particles.length; b++) {
            var pa = particles[a], pb = particles[b];
            var ddx = pa.x - pb.x;
            var ddy = pa.y - pb.y;
            var dist = Math.sqrt(ddx * ddx + ddy * ddy);
            if (dist < LINK_DIST) {
              var alpha = (1 - dist / LINK_DIST) * 0.35;
              var t = (pa.x + pb.x) / (2 * W);
              var r = accentA[0] + (accentB[0] - accentA[0]) * t;
              var g = accentA[1] + (accentB[1] - accentA[1]) * t;
              var bl = accentA[2] + (accentB[2] - accentA[2]) * t;
              ctx.beginPath();
              ctx.moveTo(pa.x, pa.y);
              ctx.lineTo(pb.x, pb.y);
              ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + bl + ',' + alpha + ')';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }

        if (!oneShot) requestAnimationFrame(step);
      }

      init();
      window.addEventListener('resize', init);

      if (!reduceMotion) {
        requestAnimationFrame(function () { step(false); });
      } else {
        step(true); // render one static frame only
      }
    })();
  </script>

</body>
</html>
